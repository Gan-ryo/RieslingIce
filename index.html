<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リースリングに氷を入れて</title>
<style>
  :root {
    --bg: #15100d;
    --panel: #221914;
    --panel-light: #2d211a;
    --text: #f0e6da;
    --sub: #b8a692;
    --accent: #d98f3b;
    --accent-dark: #8a5a20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    background: radial-gradient(ellipse at top, #241a14 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif;
  }
  #titlebar {
    text-align: center;
    margin-bottom: 18px;
  }
  #titlebar h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  #stage {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 18px;
    padding: 28px 26px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(217, 143, 59, 0.15);
  }
  #speaker {
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    min-height: 1.2em;
  }
  #text {
    font-size: 1.05rem;
    line-height: 2;
    white-space: pre-wrap;
    min-height: 7em;
    margin-bottom: 20px;
  }
  #choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }
  .choice-btn {
    text-align: left;
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid rgba(217, 143, 59, 0.25);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .choice-btn:hover {
    background: var(--accent-dark);
    border-color: var(--accent);
  }
  #advance-hint {
    text-align: right;
    font-size: 0.8rem;
    color: var(--sub);
    cursor: pointer;
    opacity: 0.8;
  }
  #advance-hint:hover { opacity: 1; }
  #ending-title {
    text-align: center;
    font-size: 1.4rem;
    color: var(--accent);
    margin: 4px 0 8px;
    letter-spacing: 0.08em;
  }
  #ending-status {
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin: 0 0 18px;
    font-family: system-ui, sans-serif;
  }
  #ending-status.game-over { color: #c23b3b; }
  #ending-status.to-be-continued { color: var(--accent); }
  #restart-btn, #continue-btn {
    display: block;
    margin: 6px auto 0;
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #restart-btn:hover, #continue-btn:hover { opacity: 0.88; }
  #restart-btn {
    background: transparent;
    color: var(--sub);
    border: 1px solid rgba(217, 143, 59, 0.3);
  }
  #sound-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid rgba(217, 143, 59, 0.3);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #sound-toggle:hover { border-color: var(--accent); }

  /* --- 涼子とチャット --- */
  #chat-open {
    position: fixed;
    top: 16px;
    left: 16px;
    background: var(--panel-light);
    color: var(--text);
    border: 1px solid rgba(217, 143, 59, 0.3);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    z-index: 20;
  }
  #chat-open:hover { border-color: var(--accent); }
  #chat-panel {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 30;
    padding: 14px;
  }
  #chat-panel.show { display: flex; }
  #chat-box {
    width: 100%;
    max-width: 480px;
    height: min(86vh, 680px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid rgba(217, 143, 59, 0.25);
    border-radius: 16px;
    overflow: hidden;
    font-family: system-ui, "Noto Sans JP", sans-serif;
  }
  #chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--panel-light);
    color: var(--accent);
    font-weight: 600;
  }
  #chat-head button {
    background: transparent;
    border: none;
    color: var(--sub);
    font-size: 1.1rem;
    cursor: pointer;
  }
  #chat-tools {
    display: flex;
    gap: 8px;
    padding: 6px 16px;
    justify-content: flex-end;
  }
  #chat-tools button {
    background: transparent;
    color: var(--sub);
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-weight: 400;
  }
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-msg {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.ryoko { align-self: flex-start; background: var(--panel-light); }
  .chat-msg.me { align-self: flex-end; background: var(--accent); color: #1a1208; }
  .chat-msg.note { align-self: center; background: transparent; color: var(--sub); font-size: 0.78rem; text-align: center; }
  #chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  #chat-input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid rgba(217, 143, 59, 0.3);
    background: var(--bg);
    color: var(--text);
    font-size: 0.92rem;
  }
  #chat-send {
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #chat-send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <button id="sound-toggle">🔊 BGM: オン</button>
  <div id="titlebar">
    <h1>リースリングに氷を入れて</h1>
  </div>
  <div id="stage">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="ending-title" style="display:none;"></div>
    <div id="ending-status" style="display:none;"></div>
    <div id="choices"></div>
    <div id="advance-hint" style="display:none;">▼ クリックして続ける</div>
    <button id="continue-btn" style="display:none;">つづきへ</button>
    <button id="restart-btn" style="display:none;">はじめから</button>
  </div>
  <button id="chat-open">💬 涼子とチャット</button>
  <div id="chat-panel">
    <div id="chat-box">
      <div id="chat-head"><span>涼子</span><button id="chat-close" aria-label="閉じる">✕</button></div>
      <div id="chat-tools">
        <button id="chat-clear">履歴を消す</button>
      </div>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="メッセージを入力" autocomplete="off">
        <button id="chat-send" type="submit">送信</button>
      </form>
    </div>
  </div>
  <audio id="bgm" src="theme.mp3" loop preload="auto"></audio>

<script>
// --- ストーリーデータ ---
// 各ノード: { speaker, text, next(文字列 or 省略=選択肢待ち), choices: [{label, setFlags, next}] }
// next / choice.next は 文字列(ノードID) か、条件リスト [{if:[フラグ名,...], next:ノードID}, ..., {next:デフォルトノードID}] のどちらか

const STORY = {
  start: {
    speaker: "",
    text: "深夜のバー。会計を済ませようとしていたら、隣から聞き覚えのある声がした。\n「——リースリングに、氷を入れてください」\n耳を疑って振り返る。そこにいたのは、3年前に別れた涼子だった。",
    next: "greet1",
  },
  greet1: {
    speaker: "涼子",
    text: "「……え、嘘でしょ」\n涼子はグラスを持ったまま固まっている。",
    choices: [
      { label: "「久しぶり。元気だった?」", next: "catchup1" },
      { label: "「……涼子、だよな」", next: "catchup1" },
      { label: "軽く会釈だけして、視線を外す", setFlags: { distant: true }, next: "catchup1_cold" },
    ],
  },
  catchup1: {
    speaker: "涼子",
    text: "「元気……は、まあ元気。びっくりした、こんなところで会うなんて」\n涼子は少し笑って、隣の席を軽く叩く。「座りなよ、一杯くらい」",
    next: "choice_catchup",
  },
  catchup1_cold: {
    speaker: "涼子",
    text: "「……そっか。偶然だね」\n涼子の声のトーンが少し硬くなる。それでも彼女は隣の席を指す。「……座る?」",
    next: "choice_catchup",
  },
  choice_catchup: {
    speaker: "",
    text: "隣に座る。涼子が「で、最近どうだったの」と聞いてくる。",
    choices: [
      { label: "「この3年、色々あったよ。正直、全部うまくいったわけじゃない」", next: "catchup2" },
      { label: "「仕事は順調だよ、昇進もしたし」", setFlags: { distant: true }, next: "catchup2" },
      { label: "「それより、涼子は?」", next: "catchup2" },
    ],
  },
  catchup2: {
    speaker: "涼子",
    text: "「私は……まあ、ぼちぼち。去年係長になった。あと——」\n少し間があって、涼子はグラスの氷を指でつつく。\n「ずっと、誰とも付き合ってない」",
    next: "the_past1",
  },
  the_past1: {
    speaker: "涼子",
    text: "涼子は少しうつむいて、グラスを見つめる。\n「ねえ、あの時さ。ちゃんと話さなかったよね、私たち」\n店内のざわめきが、少し遠くなる気がした。",
    choices: [
      { label: "「ごめん。あの時の俺、ちゃんと向き合ってなかった」", setFlags: { apologized: true }, next: "the_past2" },
      { label: "「お互い、忙しすぎたからな」", next: "the_past2" },
      { label: "「……もう昔の話だろ」", setFlags: { distant: true }, next: "the_past2_cold" },
    ],
  },
  the_past2: {
    speaker: "涼子",
    text: "涼子は少し驚いたように顔を上げる。「……うん。そうだね」\n小さく笑って、グラスを傾ける。「今更だけど、聞けてよかった」",
    next: "order_callback",
  },
  the_past2_cold: {
    speaker: "",
    text: "涼子は小さく息を吐いて、何も言わずグラスを傾ける。\n空気が少し重くなる。",
    next: "order_callback",
  },
  order_callback: {
    speaker: "",
    text: "ちょうどそこへ、バーテンダーが涼子の注文——氷の入ったリースリング——を運んでくる。\n「……まだそれ、頼むんだ」",
    choices: [
      { label: "「変わってないな。昔からだったよな、それ」", setFlags: { remembered: true }, next: "climax1" },
      { label: "「へえ、知らなかった」", next: "climax1" },
      { label: "「未だにそれ、変な飲み方だと思ってるよ」", next: "callback_tease" },
    ],
  },
  callback_tease: {
    speaker: "",
    text: "",
    next: [
      { if: ["distant"], next: "callback_tease_cold" },
      { next: "callback_tease_warm" },
    ],
  },
  callback_tease_cold: {
    speaker: "涼子",
    text: "涼子の表情がわずかに硬くなる。\n「……そういうとこ、変わってないね」",
    next: "climax1",
  },
  callback_tease_warm: {
    speaker: "涼子",
    text: "涼子はふっと笑う。\n「それ、前にもあなたが言ってたよ」",
    setFlags: { remembered: true },
    next: "climax1",
  },
  climax1: {
    speaker: "涼子",
    text: "氷がグラスの中で小さく音を立てる。\n涼子はしばらく黙って、それからゆっくり口を開いた。\n「……ねえ。また、こうやって飲みに行ってもいい?」",
    choices: [
      {
        label: "「うん。また飲もう」",
        next: [
          { if: ["apologized", "remembered"], next: "ending_reconcile" },
          { if: ["apologized"], next: "ending_awkward" },
          { if: ["remembered"], next: "ending_awkward" },
          { next: "ending_rejected" },
        ],
      },
      {
        label: "「……少し、考えさせてくれ」",
        next: [
          { if: ["distant"], next: "ending_cold" },
          { next: "ending_open" },
        ],
      },
      { label: "「——友達として、なら」", next: "ending_friends" },
    ],
  },

  // --- エンディング(ステージ1) ---
  // よりを戻す方向に進んだ3つのエンディングだけが continueTo を持ち、ステージ2へ続く。
  // 「友達」「拒絶」「冷たい別れ」の3つは、その場で物語が完結する(続きは無い)
  ending_reconcile: {
    ending: "よりを戻せた",
    speaker: "涼子",
    text: "涼子は一瞬泣きそうな顔をして、それからふっと笑った。\n「……うん。じゃあ、今度は——ちゃんと、話そうね」\n三年越しの氷が、グラスの中で静かに溶けていった。",
    continueTo: "s2_start_reconcile",
  },
  ending_awkward: {
    ending: "もう一歩",
    speaker: "涼子",
    text: "涼子は小さく頷いた。「……そうだね。また、連絡する」\nその声には、まだ少しだけ距離があるように聞こえた。\nけれど、それは「終わり」ではなく、「続き」の合図だった。",
    continueTo: "s2_start_awkward",
  },
  ending_rejected: {
    ending: "変われなかった",
    speaker: "",
    text: "涼子は少し困ったように笑って、グラスを置いた。\n「……そっか。じゃあ、今日はこれで」\n彼女は会計を済ませて、振り返らずに店を出て行った。",
  },
  ending_open: {
    ending: "答えは、まだ",
    speaker: "涼子",
    text: "涼子は少し驚いた顔をして、それから小さく笑った。\n「……うん、いいよ。急がないから」\n彼女はそう言って、連絡先の書かれた紙ナプキンをそっと渡した。",
    continueTo: "s2_start_open",
  },
  ending_cold: {
    ending: "氷のままで",
    speaker: "",
    text: "涼子は少し目を伏せて、静かにグラスを置いた。\n「……そっか。わかった」\nそれ以上、何も言わずに彼女は会計を済ませた。\nもう、連絡先を渡されることはなかった。",
  },
  ending_friends: {
    ending: "友達という答え",
    speaker: "涼子",
    text: "涼子は意外そうな顔をして、それから微笑んだ。\n「……それも、悪くないかもね」\n二人の間にあったのは、恋人でも他人でもない、新しい距離だった。",
  },

  // --- ステージ2: イタリアンレストランでのデート ---
  // ゴール: 次のテーマパークデートに誘えるかどうか。ステージ1のエンディング別に導入文が変わる
  s2_start_reconcile: {
    speaker: "",
    text: "— 二度目のデート —\n\nイタリアンレストランは、涼子が指定した店だった。あの夜から数週間——二人の距離は、少しずつ縮まっていた。",
    next: "s2_memory1",
  },
  s2_start_awkward: {
    speaker: "",
    text: "— 二度目のデート —\n\nイタリアンレストランは、涼子が指定した店だった。あの夜からしばらく、連絡は途切れず続いていたけれど、まだどこかぎこちなさが残っていた。",
    next: "s2_memory1",
  },
  s2_start_open: {
    speaker: "",
    text: "— 二度目のデート、と呼んでいいのかは分からない —\n\nそれでも涼子から「今度、ご飯でも」と連絡が来て、二人はイタリアンレストランにいた。",
    next: "s2_memory1",
  },
  s2_memory1: {
    speaker: "涼子",
    text: "「そういえば、覚えてる? 海行った時、二人とも水着忘れてきて、結局そのまま入って、びしょ濡れで帰ったやつ」\n涼子は笑いながらグラスを傾ける。",
    choices: [
      { label: "「あったな、あれ。めちゃくちゃ寒かった」", setFlags: { nostalgic: true }, next: "s2_memory2" },
      { label: "「え、そんなことあったっけ」", next: "s2_memory2" },
      { label: "「よくあんな無茶したよな」", next: "s2_memory2" },
    ],
  },
  s2_memory2: {
    speaker: "涼子",
    text: "「テーマパークではぐれた時も、焦ったなあ。結局、閉園間際まで会えなくて」\n少し遠い目をして、涼子はそう言った。",
    choices: [
      { label: "「あの時は本当に心配した。会えた瞬間、ほっとしたの覚えてる」", setFlags: { nostalgic: true }, next: "s2_pastissue1" },
      { label: "「そんなこともあったな」", next: "s2_pastissue1" },
      { label: "「俺が先に探しに行ったからだろ」", next: "s2_pastissue1" },
    ],
  },
  s2_pastissue1: {
    speaker: "涼子",
    text: "涼子は少し真剣な顔になる。\n「……ねえ、前も少し話したけど。あの頃、仕事ばっかりで全然会えなくなってたよね」\n「正直、あの時は……すごく寂しかった」",
    choices: [
      { label: "「あの時は悪かったと思ってる。もっと時間作るべきだった」", setFlags: { resolved2: true }, next: "s2_pastissue2" },
      { label: "「仕事だったから仕方なかったんだよ」", setFlags: { defensive2: true }, next: "s2_pastissue2" },
      { label: "「今は違うから、大丈夫だよ」", next: "s2_pastissue2" },
    ],
  },
  s2_pastissue2: {
    speaker: "",
    text: "",
    next: [
      { if: ["resolved2"], next: "s2_pastissue2_warm" },
      { if: ["defensive2"], next: "s2_pastissue2_cold" },
      { next: "s2_pastissue2_neutral" },
    ],
  },
  s2_pastissue2_warm: {
    speaker: "涼子",
    text: "涼子は少し驚いたように、それからほっとしたように微笑む。\n「……そう言ってくれるだけで、だいぶ違う」",
    next: "s2_climax",
  },
  s2_pastissue2_cold: {
    speaker: "涼子",
    text: "涼子は少し顔を曇らせる。\n「……そっか。まあ、昔のことだしね」\n声のトーンが、少しだけ平坦になる。",
    next: "s2_climax",
  },
  s2_pastissue2_neutral: {
    speaker: "涼子",
    text: "涼子は小さく頷く。\n「……そう、だといいな」\nどこか言い切れていないような声だった。",
    next: "s2_climax",
  },
  s2_climax: {
    speaker: "涼子",
    text: "涼子はグラスを置いて、少し照れたように笑う。\n「……今日、楽しかった。こういう時間、また作れたらいいな」",
    next: "s2_final_choice",
  },
  s2_final_choice: {
    speaker: "",
    text: "次の約束を切り出すなら、今だ。",
    choices: [
      {
        label: "「今度、一緒にテーマパーク行かない? あの時、ちゃんと最後まで一緒に回れなかったし」",
        next: [
          { if: ["defensive2"], next: "s2_ending_hesitant" },
          { next: "s2_ending_success" },
        ],
      },
      {
        label: "「また、どこか行こうよ」",
        next: [
          { if: ["resolved2", "nostalgic"], next: "s2_ending_vague_success" },
          { next: "s2_ending_vague_fail" },
        ],
      },
      { label: "何も誘わず、今日の礼だけ言う", next: "s2_ending_no_invite" },
    ],
  },

  // --- エンディング(ステージ2) ---
  // テーマパークに行くことが(明示的・暗示的に)確定した3つのエンディングだけが
  // continueTo を持ち、ステージ3へ続く。「もどかしさ」「言えなかった言葉」は
  // 具体的な約束に至っていないため、その場で完結する(続きは無い)
  s2_ending_success: {
    ending: "約束の続き",

// --- エンジン ---
let flags = {};
let currentId = "start";

const speakerEl = document.getElementById("speaker");
const textEl = document.getElementById("text");
const choicesEl = document.getElementById("choices");
const advanceHintEl = document.getElementById("advance-hint");
const endingTitleEl = document.getElementById("ending-title");
const endingStatusEl = document.getElementById("ending-status");
const restartBtnEl = document.getElementById("restart-btn");
const continueBtnEl = document.getElementById("continue-btn");

function resolveNext(nextSpec) {
  if (typeof nextSpec === "string") return nextSpec;
  for (const rule of nextSpec) {
    if (!rule.if || rule.if.every((f) => flags[f])) return rule.next;
  }
  throw new Error("no matching rule for " + JSON.stringify(nextSpec));
}

function goTo(nodeId) {
  currentId = nodeId;
  const node = STORY[nodeId];

  if (node.setFlags) Object.assign(flags, node.setFlags);

  // テキストが空のノード(純粋な分岐用)は即座に次へ進む
  if (node.text === "" && node.next) {
    goTo(resolveNext(node.next));
    return;
  }

  speakerEl.textContent = node.speaker || "";
  textEl.textContent = node.text;
  choicesEl.innerHTML = "";
  advanceHintEl.style.display = "none";
  endingTitleEl.style.display = "none";
  endingStatusEl.style.display = "none";
  endingStatusEl.className = "";
  restartBtnEl.style.display = "none";
  continueBtnEl.style.display = "none";

  if (node.ending) {
    endingTitleEl.textContent = "— " + node.ending + " —";
    endingTitleEl.style.display = "block";
    restartBtnEl.style.display = "block";
    if (node.continueTo) {
      // 次のステージへ進める(まだ道が続いている)
      continueBtnEl.style.display = "block";
      continueBtnEl.onclick = () => goTo(node.continueTo);
    } else if (node.finalSuccess) {
      // 現時点の最終ステージで成功したが、続編(次のステージ)はまだ実装されていない
      endingStatusEl.textContent = "TO BE CONTINUED";
      endingStatusEl.className = "to-be-continued";
      endingStatusEl.style.display = "block";
    } else {
      // この先には進めない、物語がここで終わる行き止まり
      endingStatusEl.textContent = "GAME OVER";
      endingStatusEl.className = "game-over";
      endingStatusEl.style.display = "block";
    }
    return;
  }

  if (node.choices) {
    for (const choice of node.choices) {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = choice.label;
      btn.addEventListener("click", () => {
        if (choice.setFlags) Object.assign(flags, choice.setFlags);
        goTo(resolveNext(choice.next));
      });
      choicesEl.appendChild(btn);
    }
  } else if (node.next) {
    advanceHintEl.style.display = "block";
    advanceHintEl.onclick = () => goTo(resolveNext(node.next));
    textEl.onclick = () => goTo(resolveNext(node.next));
  }
}

function restart() {
  flags = {};
  goTo("start");
}

restartBtnEl.addEventListener("click", restart);

goTo("start");

// --- 涼子とチャット(ローカルLLM) ---
// OpenAI互換の /chat/completions を持つローカルサーバー(Ollama)を呼ぶ。
// モデルと接続先は内部で固定し、プレイヤーには設定させない。
// ブラウザから呼ぶため、サーバー側でこのページのオリジンのCORS許可が必要(Ollama なら OLLAMA_ORIGINS)
const CHAT_MODEL = "qwen3-vl:8b-instruct-q4_K_M";
const CHAT_ENDPOINT = "http://192.168.3.25:11434/v1"; // この機械のOllama(LAN固定IP)
const CHAT_MAX_HISTORY = 40;
let chatHistory = [];
let chatBusy = false;

// チャットは「この機械(localhost)」と「自宅LAN」で開いたときだけ使える。
// GitHub Pages や Tailscale(100.x)など、それ以外のホストでは機能ごと無効にする
function chatIsLocalHost() {
  return /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
}
const FLAG_FACTS = {
  distant: "再会の場で、彼は素っ気ない・防御的な態度を取ったことがあった",
  apologized: "彼は、3年前に向き合えなかったことを素直に謝ってくれた",
  remembered: "彼は、涼子がいつも頼む「リースリングに氷」を覚えていた",
  nostalgic: "二人の思い出話に、彼は温かく応じてくれた",
  resolved2: "仕事で寂しい思いをさせたことを、彼は認めて謝ってくれた",
  defensive2: "仕事のことを、彼は「仕方なかった」と言い訳した",
  attentive: "テーマパークで、彼ははぐれないよう気遣ってくれた",
  wonPrize: "3年前に取れなかったぬいぐるみを、彼は今日取ってくれた",
};

function chatStageLabel() {
  if (currentId.startsWith("s3_")) return "ステージ3: テーマパークデート(3年前にはぐれた場所を再訪した日)";
  if (currentId.startsWith("s2_")) return "ステージ2: イタリアンレストランでの2回目のデート";
  return "ステージ1: 深夜のバーでの偶然の再会";
}

// 涼子のプロフィールは ryoko_profile.txt で編集できる。送信のたびに読み直すので、
// ファイルを保存すれば再読み込み無しで反映される。読めない場合は内蔵のデフォルトを使う
const DEFAULT_RYOKO_PROFILE = [
  "- 30歳前後の会社員。最近昇進した。この3年はずっと一人だった。",
  "- 彼とは、彼の仕事が忙しくなってすれ違い、別れた。当時は寂しかったが、彼を嫌いになったわけではない。",
  "- バーではいつも「リースリングに氷を入れて」を頼む。",
  "- 思い出: 水着を忘れて海でびしょ濡れになった日、テーマパークではぐれて閉園間際にやっと会えた日。",
  "- 素直になるのが少し苦手で、照れると軽く茶化す。でも根は優しく、誠実な言葉にはきちんと心を動かされる。",
].join("\n");

function parseRyokoProfile(text) {
  return String(text || "").split(/\r?\n/).filter((l) => !l.trim().startsWith("#")).join("\n").trim();
}
async function loadRyokoProfile() {
  try {
    const res = await fetch("ryoko_profile.txt", { cache: "no-store" });
    if (!res.ok) return DEFAULT_RYOKO_PROFILE;
    return parseRyokoProfile(await res.text()) || DEFAULT_RYOKO_PROFILE;
  } catch (e) {
    return DEFAULT_RYOKO_PROFILE;
  }
}

function buildRyokoSystemPrompt(profile) {
  const facts = Object.keys(FLAG_FACTS).filter((f) => flags[f]).map((f) => "- " + FLAG_FACTS[f]);
  const node = STORY[currentId];
  const ending = node && node.ending ? "いまは「" + node.ending + "」という場面まで来ている。直前の涼子の言葉: " + node.text.replace(/\n/g, " ") : "";
  return [
    "あなたは恋愛シミュレーションゲーム「リースリングに氷を入れて」のヒロイン、涼子を演じます。プレイヤーは、3年前に別れた元恋人の「彼」です。いま彼とスマホのメッセージアプリでやり取りしています。",
    "",
    "# 涼子について",
    profile,
    "",
    "# いまの二人の状況",
    "- 物語の進行: " + chatStageLabel(),
    ending,
    facts.length ? "- ここまでの彼の振る舞い(涼子はこれを覚えていて、態度に反映する):\n" + facts.join("\n") : "- まだ会話は始まったばかりで、特筆すべきやり取りはない。",
    "",
    "# 守ること",
    "- 日本語のメッセージアプリらしい、短く自然な話し言葉で返す。1〜3文程度。絵文字は使っても控えめに。Markdownや箇条書きは使わない。",
    "- 常に涼子として返事をする。ナレーションや心の声の描写、「涼子:」のような名前の接頭辞は付けない。",
    "- 二人が正式に付き合っているかどうかは、まだ曖昧なまま。涼子から交際を確定させたり、告白したりしない。距離が縮まる雰囲気はあってよい。",
    "- 上の「いまの二人の状況」と矛盾する出来事を作らない。新しい細かい設定を足すときは、控えめに。",
    "- 彼の態度が冷たければ涼子も距離を置き、誠実なら少しずつ心を開く。",
    "- プレイヤーが本気でAIかどうかを尋ねたときだけは、キャラクターを離れて、AIが演じていることを正直に伝える。",
  ].filter((l) => l !== "").join("\n");
}

// Qwen3 系などが出す <think>...</think> は表示しない
function extractReply(data) {
  const raw = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
  const text = String(raw || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  return { text, refused: false };
}

async function callRyoko(history) {
  const profile = await loadRyokoProfile();
  const res = await fetch(CHAT_ENDPOINT + "/chat/completions", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      model: CHAT_MODEL,
      max_tokens: 400,
      temperature: 0.8,
      stream: false,
      messages: [{ role: "system", content: buildRyokoSystemPrompt(profile) }].concat(history.slice(-CHAT_MAX_HISTORY)),
    }),
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = (j.error && (j.error.message || j.error)) || ""; } catch (e) {}
    const err = new Error(String(detail) || "HTTP " + res.status);
    err.status = res.status;
    throw err;
  }
  return extractReply(await res.json());
}

const chatPanelEl = document.getElementById("chat-panel");
const chatLogEl = document.getElementById("chat-log");
const chatInputEl = document.getElementById("chat-input");
const chatSendEl = document.getElementById("chat-send");

function chatAdd(kind, text) {
  const el = document.createElement("div");
  el.className = "chat-msg " + kind;
  el.textContent = text; // textContent のみ使用(XSS対策)
  chatLogEl.appendChild(el);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return el;
}

function chatRefreshSetup() {
  chatSendEl.disabled = chatBusy;
}

async function chatSend() {
  const text = chatInputEl.value.trim();
  if (!text || chatBusy) return;
  chatInputEl.value = "";
  chatBusy = true;
  chatRefreshSetup();
  chatHistory.push({ role: "user", content: text });
  chatAdd("me", text);
  const typing = chatAdd("note", "涼子が入力中…");
  try {
    const reply = await callRyoko(chatHistory);
    typing.remove();
    if (reply.refused || !reply.text) {
      chatHistory.pop();
      chatAdd("note", "……涼子は、うまく返事ができなかったようだ。別の言い方で送ってみてください。");
    } else {
      chatHistory.push({ role: "assistant", content: reply.text });
      chatAdd("ryoko", reply.text);
    }
  } catch (e) {
    typing.remove();
    chatHistory.pop();
    const msg = e.status === 404 ? "モデルまたは接続先が見つかりません。接続先を確認してください(" + e.message + ")"
      : e instanceof TypeError ? "ローカルLLMに接続できません。サーバーの起動と、CORS設定(Ollama なら OLLAMA_ORIGINS)を確認してください。"
      : "通信に失敗しました: " + e.message;
    chatAdd("note", msg);
  } finally {
    chatBusy = false;
    chatRefreshSetup();
    chatInputEl.focus();
  }
}

if (!chatIsLocalHost()) document.getElementById("chat-open").style.display = "none";
document.getElementById("chat-open").addEventListener("click", () => {
  chatPanelEl.classList.add("show");
  chatRefreshSetup();
  if (chatLogEl.children.length === 0) chatAdd("note", "涼子にメッセージを送ってみよう。物語の進み具合や、これまでの選択が会話に反映されます。");
});

document.getElementById("chat-clear").addEventListener("click", () => { chatHistory = []; chatLogEl.innerHTML = ""; chatAdd("note", "履歴を消しました。"); });
document.getElementById("chat-form").addEventListener("submit", (e) => { e.preventDefault(); chatSend(); });
</script>
